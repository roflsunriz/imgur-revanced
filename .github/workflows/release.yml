name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GPR_KEY || github.token }}
  ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
  ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GPR_KEY || github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties)"
          manifest_version="$(jq -r .version patches.json)"
          test "$tag_version" = "$project_version"
          test "$tag_version" = "$manifest_version"

      - name: Build and test
        run: ./gradlew clean build :patches:buildAndroid --no-daemon --no-configuration-cache

      - name: Create checksum
        run: sha256sum patches/build/libs/patches-*.rvp > patches/build/libs/SHA256SUMS

      - name: Attest RVP provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.1
        with:
          subject-path: patches/build/libs/*.rvp

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          patches/build/libs/patches-*.rvp
          patches/build/libs/SHA256SUMS
          patches.json
          --verify-tag
          --title "Imgur ReVanced ${GITHUB_REF_NAME#v}"
          --notes-file CHANGELOG.md
