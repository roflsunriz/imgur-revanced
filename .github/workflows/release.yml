name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GPR_KEY || github.token }}
  ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
  ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GPR_KEY || github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties)"
          manifest_version="$(jq -r .version patches.json)"
          test "$tag_version" = "$project_version"
          test "$tag_version" = "$manifest_version"

      - name: Build and test
        run: ./gradlew clean build :patches:buildAndroid --no-daemon --no-configuration-cache

      - name: Create checksum
        run: sha256sum patches/build/libs/patches-*.rvp > patches/build/libs/SHA256SUMS

      - name: Extract release notes
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$tag_version]" '
            found && /^\[[^]]+\]: / {
              exit
            }
            /^## \[/ {
              if (found) {
                exit
              }
              if ($0 == heading || index($0, heading " - ") == 1) {
                found = 1
              }
            }
            found { print }
            END {
              if (!found) {
                print "CHANGELOG section not found: " heading > "/dev/stderr"
                exit 1
              }
            }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Attest RVP provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.1
        with:
          subject-path: patches/build/libs/*.rvp

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          patches/build/libs/patches-*.rvp
          patches/build/libs/SHA256SUMS
          patches.json
          --verify-tag
          --title "Imgur ReVanced ${GITHUB_REF_NAME#v}"
          --notes-file release-notes.md
